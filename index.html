    <link rel="stylesheet" href="index.css">

</head>
<body>
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="imagens/binbows.png" height="35" alt="">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Binbows</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#">Lindows</a>
                </li>
                <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Produtos
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Internet Exploder</a></li>
                    <li><a class="dropdown-item" href="#">Notscape Anihilator</a></li>
                </ul>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            </div>
        </div>
    </nav>


    <main class="container-md d-flex flex-column align-items-center text-center p-2">
        <h2>Michaelsoft Binbows</h2>
        <img class="m-3" src="imagens/binbowbox.png" width="400" alt="Michaelsoft Binbows">
        <div id="price" class="d-sm-flex justify-content-between ">
            <b>R$ 999,99</b>
            <p>Em até 10x sem juros</p>
        </div>

        <form class="text-start">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Endereço de Email</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">Nós compartilhamos seu email com outros 998 parceiros comerciais.</div>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Nome</label>
                <input type="text" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3">
                <label for="addresInput" class="form-label">Endereço</label>
                <textarea class="form-control" id="exampleInputPassword1"></textarea>
            </div>
            <div class="mb-3">
                <label for="cpfInput" class="form-label">CPF</label>
                <input type="text" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3">
                <label for="range4" class="form-label">Número do Cartão</label>
                <input type="range" class="form-range" min="0000000000000000" max="9999999999999999" value="0" id="range4">
                <output for="range4" id="rangeValue" aria-hidden="true"></output>
                
                <script>
                    // This is an example script, please modify as needed
                    const rangeInput = document.getElementById('range4');
                    const rangeOutput = document.getElementById('rangeValue');
                    
                    // Set initial value
                    rangeOutput.textContent = rangeInput.value;
                    
                    rangeInput.addEventListener('input', function() {
                        rawValue = String(this.value).padStart(16, "0")
                        let segments = [];
                        for (let i = 0; i < rawValue.length; i += 4) {
                            segments.push(rawValue.slice(i, i + 4));
                        }
                        result = ""
                        segments.forEach((s) => {
                            result += (s + " ")
                        })
                        rangeOutput.textContent = result;
                    });
                    </script>

</div>
            <div class="mb-3">
                <label for="dataInput" class="form-label">Data de Validade</label>
                <input type="date" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3">
                <label for="dataInput" class="form-label">Os 3 números atrás</label>
                <input type="date" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
